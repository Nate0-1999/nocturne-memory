[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nocturne-memory"
dynamic = ["version"]
description = "NOCTURNE Memory Palace service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "croniter>=6.2.2,<7",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "tiktoken>=0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
  "testcontainers[postgres]>=4.8,<5",
]

[project.urls]
Homepage = "https://github.com/Nate0-1999/nocturne"
Source = "https://github.com/Nate0-1999/nocturne-memory"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.hatch.build.targets.sdist]
include = [
  "/Dockerfile",
  "/README.md",
  "/api_contract_fingerprints.json",
  "/pyproject.toml",
  "/src/spine",
  "/infra/billing-breaker/README.md",
  "/infra/billing-breaker/billing_breaker.py",
  "/infra/billing-breaker/deploy.sh",
  "/infra/billing-breaker/deployment_checks.py",
  "/infra/billing-breaker/main.py",
  "/infra/billing-breaker/requirements.txt",
]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "spine/_deploy/README.md"
"pyproject.toml" = "spine/_deploy/pyproject.toml"
"Dockerfile" = "spine/_deploy/Dockerfile"
"infra/billing-breaker/README.md" = "spine/_deploy/billing-breaker/README.md"
"infra/billing-breaker/billing_breaker.py" = "spine/_deploy/billing-breaker/billing_breaker.py"
"infra/billing-breaker/deploy.sh" = "spine/_deploy/billing-breaker/deploy.sh"
"infra/billing-breaker/deployment_checks.py" = "spine/_deploy/billing-breaker/deployment_checks.py"
"infra/billing-breaker/main.py" = "spine/_deploy/billing-breaker/main.py"
"infra/billing-breaker/requirements.txt" = "spine/_deploy/billing-breaker/requirements.txt"

[tool.hatch.version]
path = "src/spine/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
