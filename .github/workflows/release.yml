name: Release nocturne-memory

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the lockstep version tag
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          module = ast.parse(Path("src/spine/__init__.py").read_text(encoding="utf-8"))
          version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          PY
      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/from-sdist dist/nocturne_memory-*.tar.gz
          cmp dist/nocturne_memory-*.whl /tmp/from-sdist/nocturne_memory-*.whl
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/python -m pip install /tmp/from-sdist/nocturne_memory-*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/verify_wheel.py"
          cd "$GITHUB_WORKSPACE"
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-memory-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nocturne-memory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturne-memory-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
