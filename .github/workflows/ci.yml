name: CI

on:
  pull_request:
  push:

jobs:
  impact:
    name: Feature impact and handoff evidence
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute impact and verify DONE handoffs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git merge-base origin/main HEAD)
          fi
          python scripts/check_rules.py --freeze-only
          python bin/ledger ci --repo spine "$base..HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-impact
          path: verification/*/impacted.json

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Verify test motivations
        run: python scripts/check_test_motivations.py
      - name: Tests
        run: pytest
      - name: Build distributions and rebuild wheel from sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/nocturne-memory-sdist-wheel dist/nocturne_memory-*.tar.gz
      - name: Installed wheel smoke
        run: |
          python -m venv /tmp/nocturne-memory-wheel-smoke
          /tmp/nocturne-memory-wheel-smoke/bin/python -m pip install dist/nocturne_memory-*.whl
          cd /tmp
          /tmp/nocturne-memory-wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/verify_wheel.py"
